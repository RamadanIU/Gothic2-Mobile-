name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK, CMake, glslang, заголовки Vulkan
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" >/dev/null
          sudo apt-get install -y -q glslang-tools
          git clone -q --depth 1 https://github.com/KhronosGroup/Vulkan-Headers /tmp/vkh
          mkdir -p "$HOME/vulkan-sdk" && cp -r /tmp/vkh/include "$HOME/vulkan-sdk/"
          echo "VULKAN_SDK=$HOME/vulkan-sdk" >> "$GITHUB_ENV"
      - name: Исходники движка
        run: tools/fetch-opengothic.sh
      - name: Тесты, lint и сборка APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports
