; Поддерживаемые сборки Gothic II (docs/SUPPORTED_BUILDS.md).
;
; exeSha256=PENDING — сборка ещё не закреплена: её принимает только режим разработчика.
; Значения заполняются по отчёту о сборке (Настройки → «Отчёт о сборке игры»), который
; игрок формирует на телефоне из своей лицензионной копии. Файлы игры в репозиторий
; не добавляются.

; Основная цель: GOG-издание Gothic II: Gold Classic (THQ Nordic). Закреплено по отчёту
; от 2026-10-14. В комплекте GOG: GD3D11, Union, SystemPack, DSOAL, ScriptPatch, Mod Fix
; и отдельный System/Gothic2c.exe для классической игры.
[build:g2-gold-gog]
title=Gothic II: Gold Classic (GOG)
exe=System/Gothic2.exe
exeSha256=0655b4811e008a353ce372fde463ef00b6101f3e89be850e2f14980140447c7f
; Русская поставка (подтвердил владелец копии 2026-10-14). Файлы Speech_*_engl
; и Textures_Addon_Menu_English входят в неё же и на язык не указывают.
language=ru
requires=Data/Anims.vdf,Data/Anims_Addon.vdf,Data/Meshes.vdf,Data/Meshes_Addon.vdf,Data/Sounds.vdf,Data/Sounds_Addon.vdf,Data/Speech1.vdf,Data/Speech2.vdf,Data/Speech_Addon.vdf,Data/Textures.vdf,Data/Textures_Addon.vdf,Data/Worlds.vdf,Data/Worlds_Addon.vdf,System/Gothic2c.exe,System/GothicGame.ini,System/Paths.d,System/Paths_GII.d
requiresSha256=Data/Worlds.vdf:828dcba729283cd7029b18d5d72d9c46137b724b585a73873d58ee6a2def26b0,Data/Worlds_Addon.vdf:09074c4c4d21564f9794b363de7cc494ff728930f5f43649829de8e17bcd57bc,System/Gothic2c.exe:4bcc611fc7580481897b10f699b7905660d5f05a0a1ab05f079a4a17251b08ae
saves=Saves
ini=System/Gothic.ini
variants=notr,classic

[variant:g2-gold-gog/notr]
title=Gothic II: Ночь Ворона
; Так основную игру запускает GothicStarter. Проверить на телефоне.
args=-game:GothicGame.ini

[variant:g2-gold-gog/classic]
title=Gothic II (классическая, без дополнения)
exe=System/Gothic2c.exe
; Повторяет Gothic2c.bat из поставки (отчёт от 2026-10-14): EXE без аргументов, на время
; игры архивы аддона прячутся, System/Paths.d подменяется на Paths_GII.d, заставка — на
; SPLASH_GII.BMP; после выхода всё возвращается (VariantLayout). SPLASH.BMP в GOG нет —
; этот шаг пропускается, как и в .bat.
; Каталог сохранений задаёт Paths_GII.d; пока его содержимое не прочитано из отчёта,
; считается общим Saves. Проверить на телефоне.
args=
rename=Data/Anims_Addon.vdf>Data/Anims_Addon.disabled,Data/Meshes_Addon.vdf>Data/Meshes_Addon.disabled,Data/Sounds_Addon.vdf>Data/Sounds_Addon.disabled,Data/Speech_Addon.vdf>Data/Speech_Addon.disabled,Data/Textures_Addon.vdf>Data/Textures_Addon.disabled,Data/Textures_Addon_Menu_English.vdf>Data/Textures_Addon_Menu_English.disabled,Data/Worlds_Addon.vdf>Data/Worlds_Addon.disabled,System/Paths.d>System/Paths.disabled,System/Paths_GII.d>System/Paths.d,System/SPLASH.BMP>System/SPLASH.disabled,System/SPLASH_GII.BMP>System/SPLASH.BMP

