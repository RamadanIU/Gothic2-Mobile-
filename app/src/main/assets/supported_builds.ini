; Поддерживаемые сборки Gothic II (docs/SUPPORTED_BUILDS.md).
;
; exeSha256=PENDING — сборка ещё не закреплена: её принимает только режим разработчика.
; Значения заполняются по отчёту о сборке (Настройки → «Отчёт о сборке игры»), который
; игрок формирует на телефоне из своей лицензионной копии. Файлы игры в репозиторий
; не добавляются.

; Основная цель: Gold-издание (Gothic II + «Ночь Ворона»). Два варианта запуска.
[build:g2-gold-ru]
title=Gothic II: Золотое издание (рус.)
exe=System/Gothic2.exe
exeSha256=PENDING
language=ru
requires=Data/Worlds.vdf,Data/Textures.vdf,Data/Meshes.vdf,Data/Anims.vdf,Data/Worlds_Addon.vdf
saves=Saves
ini=System/GOTHIC.INI
variants=notr,classic

[variant:g2-gold-ru/notr]
title=Gothic II: Ночь Ворона
; Обычный запуск Gold. Проверить, не нужен ли явный -game:GothicGame.ini.
args=

[variant:g2-gold-ru/classic]
title=Gothic II (классическая, без дополнения)
; Способ запуска Classic внутри Gold (ini/мод в System, архив в Data/modvdf)
; определяется по отчёту о сборке. До этого вариант не предлагается игроку.
args=PENDING

; Отдельная Classic без дополнения (диск 2002–2003 гг.). Отличается отсутствием архивов аддона.
[build:g2-classic-ru]
title=Gothic II Classic (рус.)
exe=System/Gothic2.exe
exeSha256=PENDING
language=ru
requires=Data/Worlds.vdf,Data/Textures.vdf,Data/Meshes.vdf,Data/Anims.vdf
forbids=Data/Worlds_Addon.vdf
saves=Saves
ini=System/GOTHIC.INI
